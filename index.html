<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四語學習工作坊｜ES · CA · EN · ZH</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --border: #e5e7eb;
      --success: #059669;
      --warning: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-weight: 700; font-size: 1.1rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
    }
    button:hover, .btn:hover { background: #f9fafb; }
    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.primary:hover { opacity: 0.92; }
    .container {
      max-width: 1080px;
      margin: 20px auto;
      padding: 0 16px 60px;
    }
    .status-bar {
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }
    .lesson-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .lesson-pill {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .lesson-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .badge {
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .lang-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }
    .lang-tab.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }
    .para-box {
      padding: 12px 14px;
      border-left: 3px solid var(--primary);
      background: #fafafa;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .sub-lang {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .item-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fcfcfd;
    }
    .sync-box {
      display: none;
      margin-bottom: 18px;
    }
    .sync-box.open { display: block; }
    textarea {
      width: 100%;
      min-height: 90px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .quiz-opt {
      display: block;
      width: 100%;
      text-align: left;
      margin: 6px 0;
      padding: 9px 12px;
    }
    .quiz-opt.correct {
      background: #ecfdf5;
      border-color: var(--success);
      color: #065f46;
    }
    .quiz-opt.wrong {
      background: #fef2f2;
      border-color: #dc2626;
      color: #991b1b;
    }
    .explain {
      margin-top: 8px;
      padding: 10px;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">四語學習工作坊（ES · CA · EN · ZH）</div>
      <div class="toolbar">
        <label class="btn primary">
          匯入文章 (JSON)
          <input id="importFile" type="file" accept=".json,application/json" multiple hidden />
        </label>
        <button id="exportBtn" type="button">匯出全部 JSON</button>
        <button id="toggleSyncBtn" type="button">跨裝置同步（電腦→手機）</button>
        <button id="resetBtn" type="button">還原預設</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="syncPanel" class="card sync-box">
      <h3 style="margin-top:0">電腦 → 手機 跨裝置同步</h3>
      <p style="margin:0 0 10px;color:var(--muted);font-size:0.92rem;">
        瀏覽器本機儲存（<code>localStorage</code>）不會跨裝置自動傳送。你可以在<b>電腦</b>按「產生同步碼」複製到手機貼上匯入，或複製「同步網址」在手機開啟。
      </p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <button id="genCodeBtn" type="button" class="primary">1. 產生同步碼（電腦端）</button>
        <button id="genLinkBtn" type="button">產生同步連結</button>
        <button id="applyCodeBtn" type="button" class="primary">2. 套用同步碼／連結（手機端）</button>
      </div>
      <textarea id="syncText" placeholder="點「產生同步碼」取得代碼，或在手機貼上同步碼／同步連結後按「套用同步碼／連結」..."></textarea>
    </div>

    <div class="status-bar">
      <div id="storageStatus">已載入文章，自動儲存於本機瀏覽器。</div>
      <div id="lessonCount"></div>
    </div>

    <div id="lessonNav" class="lesson-nav"></div>
    <div id="lessonContent"></div>
  </main>

  <script>
    const STORAGE_KEY = "quad_lang_lessons_v1";

    const DEFAULT_LESSONS = [
      {
        id: "demo-01-hola-mundo",
        unitLabel: "第 1 篇",
        topic: "日常問候與自我介紹",
        level: "A1 入門",
        duration: "約 15 分鐘單元",
        title: "Saludar y presentarse en el día a día",
        caTitle: "Saludar i presentar-se en el dia a dia",
        esParagraphs: [
          "Hola, me llamo Sofía y vivo en Barcelona. Cada mañana salgo a pasear cerca del parque y saludo a los vecinos.",
          "Me gusta aprender idiomas con calma y escuchar conversaciones reales."
        ],
        caParagraphs: [
          "Hola, em dic Sofia i visc a Barcelona. Cada matí surto a passejar a prop del parc i saludo els veïns.",
          "M'agrada aprendre idiomes amb calma i escoltar converses reals."
        ],
        zhParagraphs: [
          "嗨，我叫索菲亞，住在巴塞隆納。每天早上我都會到公園附近散步，並向鄰居問好。",
          "我喜歡平靜地學習語言，也喜歡聽真實的對話。"
        ],
        enParagraphs: [
          "Hi, my name is Sofía and I live in Barcelona. Every morning I go for a walk near the park and greet the neighbors.",
          "I like learning languages calmly and listening to real conversations."
        ],
        vocab: [
          {
            word: "saludar",
            caWord: "saludar",
            pos: "動詞",
            meaning: "問候、打招呼（EN: greet）",
            example: "Saludo a mis compañeros al llegar.",
            caExample: "Saludo els meus companys en arribar.",
            origin: "源自拉丁文 salutare（祝安康、致意）。"
          }
        ],
        phrases: [
          {
            phrase: "en el día a día",
            caPhrase: "en el dia a dia",
            meaning: "在日常生活中（EN: in everyday life）",
            example: "Practicamos saludos en el día a día.",
            caExample: "Practiquem salutacions en el dia a dia.",
            origin: "強調每天實際發生的生活場景。"
          }
        ],
        grammar: [
          {
            title: "1. 「llamarse」自我介紹",
            explanation: "西班牙文用「me llamo + 名字」表示「我叫……」。",
            example: "ES: Me llamo Mateo.",
            caExample: "CA: Em dic Mateu."
          }
        ],
        quiz: [
          {
            esQ: "1. ¿Dónde vive Sofía?",
            caQ: "1. On viu la Sofia?",
            enQ: "1. Where does Sofía live?",
            zhQ: "1. 索菲亞住在哪裡？",
            esOpts: ["En Barcelona", "En Tokio", "En Lima", "En Oslo"],
            caOpts: ["A Barcelona", "A Tòquio", "A Lima", "A Oslo"],
            enOpts: ["In Barcelona", "In Tokyo", "In Lima", "In Oslo"],
            zhOpts: ["巴塞隆納", "東京", "利馬", "奧斯陸"],
            answer: 0,
            esExplain: "Sofía dice: 'vivo en Barcelona'.",
            caExplain: "La Sofia diu: 'visc a Barcelona'.",
            enExplain: "Sofía says she lives in Barcelona.",
            zhExplain: "第一段提到她住在巴塞隆納。"
          }
        ]
      }
    ];

    let state = {
      lessons: [],
      activeIndex: 0,
      primaryLang: "es",
      showSubZh: true,
      quizAnswers: {}
    };

    function encodeBase64Url(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeBase64Url(b64url) {
      const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
      const pad = b64.length % 4 ? "=".repeat(4 - (b64.length % 4)) : "";
      const bin = atob(b64 + pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function normalizeLessons(list) {
      return list.map((item, idx) => ({
        ...item,
        id: item.id || `lesson-${idx + 1}`,
        unitLabel: `第 ${idx + 1} 篇`
      }));
    }

    function saveLessonsToStorage(lessons) {
      const normalized = normalizeLessons(lessons);
      state.lessons = normalized;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
        updateStatus(`已儲存於本機瀏覽器（${new Date().toLocaleTimeString()}）`);
      } catch (err) {
        updateStatus("本機儲存空間不足或受限，建議使用「匯出全部 JSON」備份。");
      }
    }

    function loadInitialLessons() {
      // 1. 先檢查網址列是否有 #sync= 跨裝置同步參數
      const hash = window.location.hash || "";
      if (hash.startsWith("#sync=")) {
        try {
          const decoded = JSON.parse(decodeBase64Url(hash.slice(6)));
          const incoming = Array.isArray(decoded) ? decoded : (decoded.lessons || []);
          if (incoming.length > 0) {
            const existing = readLocalStorageLessons() || DEFAULT_LESSONS;
            const merged = mergeLessons(existing, incoming);
            saveLessonsToStorage(merged);
            history.replaceState(null, "", window.location.pathname + window.location.search);
            updateStatus(`已從同步連結匯入並儲存 ${incoming.length} 篇文章！`);
            return merged;
          }
        } catch (e) {
          console.warn("同步連結解析失敗", e);
        }
      }

      // 2. 讀取 localStorage
      const localData = readLocalStorageLessons();
      if (localData && localData.length > 0) {
        updateStatus("已從本機瀏覽器載入已儲存文章。");
        return normalizeLessons(localData);
      }

      // 3. 首次使用載入預設文章並寫入 localStorage
      const init = normalizeLessons(DEFAULT_LESSONS);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
      updateStatus("首次載入預設文章，已建立本機儲存。");
      return init;
    }

    function readLocalStorageLessons() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : (parsed.lessons || null);
      } catch (e) {
        return null;
      }
    }

    function mergeLessons(baseList, incomingList) {
      const map = new Map();
      baseList.forEach(item => map.set(item.id, item));
      incomingList.forEach(item => {
        const key = item.id || `imported-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        map.set(key, { ...item, id: key });
      });
      return normalizeLessons(Array.from(map.values()));
    }

    function updateStatus(msg) {
      document.getElementById("storageStatus").textContent = msg;
      document.getElementById("lessonCount").textContent = `共 ${state.lessons.length} 篇文章`;
    }

    function render() {
      renderNav();
      renderLesson();
      updateStatus(document.getElementById("storageStatus").textContent);
    }

    function renderNav() {
      const nav = document.getElementById("lessonNav");
      nav.innerHTML = "";
      state.lessons.forEach((lesson, idx) => {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = `lesson-pill ${idx === state.activeIndex ? "active" : ""}`;
        pill.textContent = `${lesson.unitLabel} · ${lesson.title}`;
        pill.onclick = () => {
          state.activeIndex = idx;
          render();
        };
        nav.appendChild(pill);
      });
    }

    function getParagraphSet(lesson, lang) {
      if (lang === "ca") return lesson.caParagraphs || [];
      if (lang === "en") return lesson.enParagraphs || [];
      if (lang === "zh") return lesson.zhParagraphs || [];
      return lesson.esParagraphs || [];
    }

    function renderLesson() {
      const container = document.getElementById("lessonContent");
      const lesson = state.lessons[state.activeIndex];
      if (!lesson) {
        container.innerHTML = `<div class="card">目前沒有文章，請點選右上角「匯入文章 (JSON)」。</div>`;
        return;
      }

      const mainParas = getParagraphSet(lesson, state.primaryLang);
      const zhParas = lesson.zhParagraphs || [];

      const parasHtml = mainParas.map((p, i) => `
        <div class="para-box">
          <div>${p}</div>
          ${(state.showSubZh && state.primaryLang !== "zh" && zhParas[i]) ? `<div class="sub-lang">${zhParas[i]}</div>` : ""}
        </div>
      `).join("");

      const vocabHtml = (lesson.vocab || []).map(v => `
        <div class="item-card">
          <div><strong>${v.word}</strong> <span style="color:var(--muted)">(${v.caWord || ""}) · ${v.pos || ""}</span></div>
          <div style="margin:4px 0">${v.meaning || ""}</div>
          <div style="font-size:0.9rem">${v.example || ""}</div>
          ${v.origin ? `<div class="sub-lang">詞源：${v.origin}</div>` : ""}
        </div>
      `).join("");

      const phrasesHtml = (lesson.phrases || []).map(p => `
        <div class="item-card">
          <div><strong>${p.phrase}</strong> <span style="color:var(--muted)">(${p.caPhrase || ""})</span></div>
          <div style="margin:4px 0">${p.meaning || ""}</div>
          <div style="font-size:0.9rem">${p.example || ""}</div>
        </div>
      `).join("");

      const grammarHtml = (lesson.grammar || []).map(g => `
        <div class="item-card">
          <div><strong>${g.title}</strong></div>
          <div style="margin:4px 0">${g.explanation || ""}</div>
          <div class="sub-lang">${g.example || ""}</div>
          <div class="sub-lang">${g.caExample || ""}</div>
        </div>
      `).join("");

      const quizHtml = (lesson.quiz || []).map((q, qIdx) => {
        const key = `${lesson.id}-${qIdx}`;
        const picked = state.quizAnswers[key];
        const opts = (state.primaryLang === "ca" ? q.caOpts : state.primaryLang === "en" ? q.enOpts : state.primaryLang === "zh" ? q.zhOpts : q.esOpts) || q.esOpts || [];
        const questionText = (state.primaryLang === "ca" ? q.caQ : state.primaryLang === "en" ? q.enQ : state.primaryLang === "zh" ? q.zhQ : q.esQ) || q.esQ || "";
        const explainText = (state.primaryLang === "ca" ? q.caExplain : state.primaryLang === "en" ? q.enExplain : state.primaryLang === "zh" ? q.zhExplain : q.esExplain) || q.zhExplain || "";

        const optsButtons = opts.map((opt, oIdx) => {
          let cls = "quiz-opt";
          if (picked !== undefined) {
            if (oIdx === q.answer) cls += " correct";
            else if (oIdx === picked) cls += " wrong";
          }
          return `<button type="button" class="${cls}" onclick="selectAnswer('${key}', ${oIdx})">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`;
        }).join("");

        return `
          <div class="item-card" style="margin-bottom:10px">
            <div><strong>${questionText}</strong></div>
            ${optsButtons}
            ${picked !== undefined ? `<div class="explain"><strong>解析：</strong>${explainText}（${q.zhExplain || ""}）</div>` : ""}
          </div>
        `;
      }).join("");

      container.innerHTML = `
        <div class="card">
          <div class="meta">
            <span class="badge">${lesson.unitLabel}</span>
            <span class="badge">${lesson.topic || ""}</span>
            <span class="badge">${lesson.level || ""}</span>
            <span class="badge">${lesson.duration || ""}</span>
          </div>
          <h2 style="margin:6px 0 2px">${lesson.title}</h2>
          <div style="color:var(--muted)">${lesson.caTitle || ""}</div>

          <div class="lang-tabs">
            <button type="button" class="lang-tab ${state.primaryLang === "es" ? "active" : ""}" onclick="setLang('es')">西班牙文 ES</button>
            <button type="button" class="lang-tab ${state.primaryLang === "ca" ? "active" : ""}" onclick="setLang('ca')">加泰隆尼亞文 CA</button>
            <button type="button" class="lang-tab ${state.primaryLang === "en" ? "active" : ""}" onclick="setLang('en')">英文 EN</button>
            <button type="button" class="lang-tab ${state.primaryLang === "zh" ? "active" : ""}" onclick="setLang('zh')">繁體中文 ZH</button>
            <button type="button" onclick="toggleSubZh()">${state.showSubZh ? "隱藏中文對照" : "顯示中文對照"}</button>
          </div>

          ${parasHtml}
        </div>

        <div class="card">
          <h3 style="margin-top:0">重要單字（${(lesson.vocab || []).length}）</h3>
          <div class="grid-2">${vocabHtml || "無單字資料"}</div>
        </div>

        <div class="card">
          <h3 style="margin-top:0">實用片語（${(lesson.phrases || []).length}）</h3>
          <div class="grid-2">${phrasesHtml || "無片語資料"}</div>
        </div>

        <div class="card">
          <h3 style="margin-top:0">文法重點（${(lesson.grammar || []).length}）</h3>
          <div class="grid-2">${grammarHtml || "無文法資料"}</div>
        </div>

        <div class="card">
          <h3 style="margin-top:0">四語測驗（${(lesson.quiz || []).length}）</h3>
          ${quizHtml || "無測驗資料"}
        </div>
      `;
    }

    window.setLang = (lang) => {
      state.primaryLang = lang;
      render();
    };

    window.toggleSubZh = () => {
      state.showSubZh = !state.showSubZh;
      render();
    };

    window.selectAnswer = (key, idx) => {
      state.quizAnswers[key] = idx;
      render();
    };

    // 匯入 JSON 檔案（支援單篇、陣列或 { lessons: [...] }）
    document.getElementById("importFile").addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      let importedCount = 0;
      for (const file of files) {
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.lessons) ? parsed.lessons : [parsed]);
          const valid = list.filter(item => item && (item.title || item.esParagraphs || item.zhParagraphs));
          if (valid.length > 0) {
            const merged = mergeLessons(state.lessons, valid);
            saveLessonsToStorage(merged);
            importedCount += valid.length;
          }
        } catch (err) {
          alert(`檔案「${file.name}」JSON 格式有誤：${err.message}`);
        }
      }

      if (importedCount > 0) {
        state.activeIndex = Math.max(0, state.lessons.length - importedCount);
        render();
        alert(`成功匯入並儲存 ${importedCount} 篇文章！重新整理不會遺失。`);
      }
      e.target.value = "";
    });

    // 匯出全部文章 JSON
    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ lessons: state.lessons }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `quad-lessons-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // 還原預設
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("確定要清除已匯入的文章並還原成預設文章嗎？")) return;
      localStorage.removeItem(STORAGE_KEY);
      state.activeIndex = 0;
      state.lessons = loadInitialLessons();
      render();
    });

    // 跨裝置同步面板
    document.getElementById("toggleSyncBtn").addEventListener("click", () => {
      document.getElementById("syncPanel").classList.toggle("open");
    });

    document.getElementById("genCodeBtn").addEventListener("click", () => {
      const code = encodeBase64Url(JSON.stringify({ lessons: state.lessons }));
      const box = document.getElementById("syncText");
      box.value = code;
      box.select();
      navigator.clipboard?.writeText(code).catch(() => {});
      alert("已產生同步碼並嘗試複製到剪貼簿！請傳到手機貼上後按「套用同步碼／連結」。");
    });

    document.getElementById("genLinkBtn").addEventListener("click", () => {
      const code = encodeBase64Url(JSON.stringify({ lessons: state.lessons }));
      const link = `${window.location.origin}${window.location.pathname}#sync=${code}`;
      const box = document.getElementById("syncText");
      box.value = link;
      box.select();
      navigator.clipboard?.writeText(link).catch(() => {});
      alert("已產生同步連結！傳到手機瀏覽器打開即可自動存入手機。");
    });

    document.getElementById("applyCodeBtn").addEventListener("click", () => {
      let raw = document.getElementById("syncText").value.trim();
      if (!raw) return alert("請先貼上同步碼或同步連結。");
      const hashIdx = raw.indexOf("#sync=");
      if (hashIdx !== -1) raw = raw.slice(hashIdx + 6);
      try {
        const parsed = JSON.parse(decodeBase64Url(raw));
        const list = Array.isArray(parsed) ? parsed : (parsed.lessons || []);
        if (!list.length) return alert("同步碼內沒有文章資料。");
        const merged = mergeLessons(state.lessons, list);
        saveLessonsToStorage(merged);
        state.activeIndex = 0;
        render();
        alert(`已成功同步 ${list.length} 篇文章到這台裝置！`);
      } catch (e) {
        alert("同步碼格式無效，請確認是否複製完整。");
      }
    });

    state.lessons = loadInitialLessons();
    render();
  </script>
</body>
</html>
