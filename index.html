<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="西文深度閱讀站" />
  <meta name="theme-color" content="#fffaf0" />
  <title>西文深度閱讀站</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='26' fill='%23efe3cc'/%3E%3Crect x='10' y='10' width='108' height='108' rx='20' fill='none' stroke='%23c8b28e' stroke-width='3'/%3E%3Cg transform='translate(64,64)'%3E%3Cellipse cx='0' cy='-25' rx='12' ry='21' fill='%23d48c46' stroke='%238c5220' stroke-width='2.5'/%3E%3Cellipse cx='0' cy='25' rx='12' ry='21' fill='%23d48c46' stroke='%238c5220' stroke-width='2.5'/%3E%3Cellipse cx='-25' cy='0' rx='21' ry='12' fill='%23d48c46' stroke='%238c5220' stroke-width='2.5'/%3E%3Cellipse cx='25' cy='0' rx='21' ry='12' fill='%23d48c46' stroke='%238c5220' stroke-width='2.5'/%3E%3Ccircle cx='0' cy='0' r='11' fill='%23f5d08a' stroke='%238c5220' stroke-width='2.5'/%3E%3Ccircle cx='0' cy='0' r='4' fill='%238c5220'/%3E%3C/g%3E%3C/svg%3E"
  />
  <link
    rel="apple-touch-icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%23efe3cc'/%3E%3Crect x='14' y='14' width='152' height='152' rx='28' fill='none' stroke='%23c8b28e' stroke-width='4'/%3E%3Cg transform='translate(90,90)'%3E%3Cellipse cx='0' cy='-35' rx='17' ry='29' fill='%23d48c46' stroke='%238c5220' stroke-width='3.5'/%3E%3Cellipse cx='0' cy='35' rx='17' ry='29' fill='%23d48c46' stroke='%238c5220' stroke-width='3.5'/%3E%3Cellipse cx='-35' cy='0' rx='29' ry='17' fill='%23d48c46' stroke='%238c5220' stroke-width='3.5'/%3E%3Cellipse cx='35' cy='0' rx='29' ry='17' fill='%23d48c46' stroke='%238c5220' stroke-width='3.5'/%3E%3Ccircle cx='0' cy='0' r='15' fill='%23f5d08a' stroke='%238c5220' stroke-width='3.5'/%3E%3Ccircle cx='0' cy='0' r='5.5' fill='%238c5220'/%3E%3C/g%3E%3C/svg%3E"
  />
  <style>
    :root {
      --primary: #c85a17;
      --primary-hover: #a8460c;
      --warm-btn: #FFFCF6;
      --warm-btn-hover: #f6eedc;
      --warm-border: #d9be8c;
      --warm-shadow: #d4b47c;
      --primary-shadow: #8c3b0b;
      --accent: #1d5d8c;
      --accent-light: #e8f3fb;
      --ca-color: #2c6e49;
      --ca-light: #ecf7f0;
      --bg: #fbf7ef;
      --card: #fffdf9;
      --text: #3E3A39;
      --muted: #6b5e50;
      --border: #e5d8c1;
      --success: #2b7a3b;
      --success-bg: #edf9ef;
      --danger: #b52b27;
      --danger-bg: #fdf0ef;
      --origin-bg: #f6effa;
      --origin-border: #dfd0eb;
      --origin-text: #563278;
      --grammar-bg: #FFFFFF;
      --grammar-border: #e5d8c1;
      --header-offset: 108px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      font-size: clamp(0.95rem, 0.4vw + 0.88rem, 1.05rem);
    }

    section[id],
    h2[id] {
      scroll-margin-top: calc(var(--header-offset) + 14px);
    }

    /* 頂端固定導覽列：左品牌、中兩排置中對齊選單、右上下篇 */
    header {
      background: #fffaf0;
      border-bottom: 1px solid var(--border);
      padding: 10px clamp(12px, 2.5vw, 24px);
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 4px 12px rgba(130, 96, 52, 0.08);
    }

    .header-bar {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(150px, 1fr) auto minmax(190px, 1fr);
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .header-brand {
      justify-self: start;
      font-size: clamp(1.02rem, 1.1vw + 0.78rem, 1.2rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1.3;
      white-space: nowrap;
    }

    .header-nav-stack {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .nav-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .lesson-pager-group {
      justify-self: end;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .unit-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* 點擊「文章總覽」跳出的選單彈窗 */
    .overview-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(62, 58, 57, 0.28);
      z-index: 38;
      display: none;
    }
    .overview-menu-backdrop.open {
      display: block;
    }

    .overview-menu-popover {
      position: fixed;
      top: calc(var(--header-offset) + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, calc(100vw - 24px));
      max-height: 72vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 12px 32px rgba(68, 46, 22, 0.18);
      z-index: 40;
      display: none;
    }
    .overview-menu-popover.open {
      display: block;
    }

    .overview-menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .overview-menu-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }

    .overview-title-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .overview-title-item-btn {
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .overview-title-item-btn.active {
      background: #eed8aa;
      border-color: var(--primary);
    }

    .overview-item-meta {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .overview-item-heading {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
    }

    /* #FFFCF6 按鈕 + 單一底色陰影 */
    button {
      cursor: pointer;
      background: var(--warm-btn);
      color: var(--text);
      border: 1px solid var(--warm-border);
      padding: 6px 12px;
      border-radius: 9px;
      font-size: clamp(0.84rem, 0.3vw + 0.78rem, 0.92rem);
      font-weight: 600;
      box-shadow: 0 3px 0 var(--warm-shadow);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--warm-btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--warm-shadow);
    }

    button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--warm-shadow);
    }

    button.primary {
      background: var(--primary);
      color: #fffdf9;
      border-color: var(--primary);
      box-shadow: 0 3px 0 var(--primary-shadow);
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 4px 0 var(--primary-shadow);
    }

    button.primary:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--primary-shadow);
    }

    button.active-pill {
      background: #eed8aa;
      border-color: var(--primary);
      color: var(--primary-hover);
      box-shadow: 0 3px 0 var(--warm-shadow);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--warm-border);
      background: #fffdf8;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 500;
      max-width: min(230px, 100%);
      box-shadow: 0 2px 0 var(--warm-shadow);
    }

    main {
      max-width: 1080px;
      margin: 18px auto 0;
      padding: 0 clamp(12px, 2.5vw, 24px) 96px;
      display: grid;
      gap: 20px;
    }

    /* 巴塞隆納 SVG 插畫橫幅 */
    .bcn-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(14px, 2vw, 20px);
      box-shadow: 0 4px 14px rgba(140, 102, 54, 0.06);
      position: relative;
    }

    .bcn-banner-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      position: relative;
    }

    .bcn-caption-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .bcn-title {
      font-weight: 800;
      font-size: clamp(0.98rem, 0.7vw + 0.85rem, 1.12rem);
      color: var(--text);
    }

    .bcn-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      position: relative;
    }

    .bcn-menu-wrap {
      position: relative;
    }

    .bcn-controls-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: max-content;
      min-width: 136px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 24px rgba(68, 46, 22, 0.16);
      z-index: 20;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .bcn-controls-dropdown.open {
      display: flex;
    }

    .bcn-controls-dropdown button {
      width: auto;
      padding: 5px 10px;
      font-size: 0.83rem;
      text-align: center;
      white-space: nowrap;
    }

    .bcn-svg-frame {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #f5efe2;
    }

    .bcn-svg-frame svg {
      width: 100%;
      height: auto;
      max-height: 270px;
      display: block;
    }

    .bcn-desc {
      margin-top: 10px;
      font-size: 0.92rem;
      color: var(--text);
    }

    .bcn-gallery-panel {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      display: none;
    }
    .bcn-gallery-panel.open { display: block; }

    .bcn-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
    }

    .bcn-thumb-btn {
      padding: 8px;
      border-radius: 10px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bcn-thumb-btn.active {
      background: #eed8aa;
      border-color: var(--primary);
    }
    .bcn-thumb-btn svg {
      width: 100%;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      background: #f5efe2;
      display: block;
    }
    .bcn-thumb-label {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.3;
    }

    /* 輕微動態效果 */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes gentleDrift {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(5px); }
    }

    @keyframes gentlePulse {
      0%, 100% { opacity: 0.78; }
      50% { opacity: 1; }
    }

    .anim-float {
      animation: gentleFloat 4.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .anim-drift {
      animation: gentleDrift 5.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .anim-pulse {
      animation: gentlePulse 3.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    body.reduced-motion .anim-float,
    body.reduced-motion .anim-drift,
    body.reduced-motion .anim-pulse {
      animation: none !important;
      transform: none !important;
      opacity: 1 !important;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .anim-float,
      .anim-drift,
      .anim-pulse {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }

    /* 本機 JSON 管理列 */
    .io-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 3px 10px rgba(140, 102, 54, 0.04);
    }

    .io-title { font-weight: 700; font-size: 0.96rem; color: var(--text); }
    .io-desc { font-size: 0.85rem; color: var(--muted); }
    .io-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .sync-drawer {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .sync-drawer.open {
      display: flex;
    }
    .sync-textarea {
      width: 100%;
      min-height: 76px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--warm-border);
      background: #fffdf8;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      resize: vertical;
    }
    .sync-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .io-status {
      width: 100%;
      font-size: 0.88rem;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }
    .io-status.show { display: block; }
    .io-status.ok {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #b8e4c1;
    }
    .io-status.bad {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #f4c2be;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: clamp(16px, 2.5vw, 24px);
      box-shadow: 0 3px 12px rgba(140, 102, 54, 0.04);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .badge {
      background: #faeed5;
      color: var(--primary-hover);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .topic-badge {
      background: var(--accent-light);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .time-badge {
      background: #f3ece0;
      color: var(--text);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    h1, h2, h3 { margin-top: 0; color: var(--text); }
    h1 { font-size: clamp(1.25rem, 1.4vw + 0.95rem, 1.56rem); margin-bottom: 10px; }
    h2 {
      font-size: clamp(1.08rem, 0.8vw + 0.9rem, 1.24rem);
      margin-bottom: 16px;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }

    /* 文章內容底色改為白色 */
    .es-text {
      font-size: clamp(1rem, 0.45vw + 0.92rem, 1.12rem);
      background: #FFFFFF;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: clamp(14px, 2vw, 20px);
      margin: 12px 0;
    }
    .es-text p { margin: 0 0 14px; }
    .es-text p:last-child { margin-bottom: 0; }

    .ca-text {
      background: var(--ca-light);
      border-left: 4px solid var(--ca-color);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      color: #1c442d;
      margin-top: 12px;
    }

    .zh-text {
      background: #fdf8ee;
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      color: var(--text);
      margin-top: 12px;
    }

    .en-text {
      background: #f3f8fc;
      border-left: 4px solid var(--accent);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      color: #1c355e;
      margin-top: 12px;
    }

    .ca-text p, .zh-text p, .en-text p { margin: 0 0 10px; }
    .ca-text p:last-child, .zh-text p:last-child, .en-text p:last-child { margin-bottom: 0; }

    .trans-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: block;
      opacity: 0.9;
    }

    .audio-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      padding: 14px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .audio-controls-row,
    .voice-select-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .voice-field {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      color: var(--muted);
      font-weight: 600;
    }

    .speech-status {
      font-size: 0.85rem;
      color: var(--primary-hover);
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 16px;
    }

    .item-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #fffdf9;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .es-word {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--primary);
    }

    .pos {
      font-size: 0.8rem;
      color: var(--muted);
      background: #f5ebd6;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .ca-box {
      font-size: 0.88rem;
      color: #1c442d;
      background: var(--ca-light);
      border: 1px solid #bfe2cb;
      padding: 8px 10px;
      border-radius: 8px;
    }

    .meaning-line { font-size: 0.94rem; color: var(--text); }

    .example {
      font-size: 0.89rem;
      color: var(--text);
      background: #faf4e8;
      padding: 8px 10px;
      border-radius: 8px;
    }

    .origin-box {
      font-size: 0.86rem;
      color: var(--origin-text);
      background: var(--origin-bg);
      border: 1px solid var(--origin-border);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .grammar-box {
      background: var(--grammar-bg);
      color: var(--text);
      border: 1px solid var(--grammar-border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .grammar-box:last-child { margin-bottom: 0; }

    .quiz-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .lang-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quiz-q {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border);
    }
    .quiz-q:last-of-type { border-bottom: none; }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.93rem;
      background: #fffdf9;
      color: var(--text);
    }
    .option-label:hover { background: #faeed5; }

    .feedback {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
    }
    .feedback.ok {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #b8e4c1;
    }
    .feedback.bad {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #f4c2be;
    }

    .quiz-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .review-note {
      font-size: 0.88rem;
      color: var(--muted);
    }

    /* 常駐右下角純向上箭頭按鈕 */
    .scroll-top-btn {
      position: fixed;
      right: clamp(14px, 2.5vw, 24px);
      bottom: clamp(14px, 2.5vw, 24px);
      z-index: 35;
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fffdf9;
      border: 1px solid var(--primary);
      box-shadow: 0 4px 0 var(--primary-shadow);
    }
    .scroll-top-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 0 var(--primary-shadow);
    }

    @media (max-width: 900px) {
      .header-bar {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 8px;
      }
      .header-brand,
      .header-nav-stack,
      .lesson-pager-group {
        justify-self: center;
        justify-content: center;
      }
    }

    @media (max-width: 600px) {
      button {
        padding: 6px 10px;
        font-size: 0.84rem;
      }
      .bcn-gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    function getCurrentSeason() {
      const month = new Date().getMonth() + 1;
      if (month >= 3 && month <= 5) return "spring";
      if (month >= 6 && month <= 8) return "summer";
      if (month >= 9 && month <= 11) return "autumn";
      return "winter";
    }

    function pickSeasonalIllustration(excludeId = null) {
      const season = getCurrentSeason();
      const pool = BCN_ILLUSTRATIONS.filter(item => item.seasons.includes(season));
      const candidates = pool.length > 1 && excludeId
        ? pool.filter(item => item.id !== excludeId)
        : (pool.length > 0 ? pool : BCN_ILLUSTRATIONS);
      const idx = Math.floor(Math.random() * candidates.length);
      return candidates[idx];
    }

    /* =========================================================================
       本機儲存（localStorage）與跨裝置同步碼工具
       ========================================================================= */
    const STORAGE_KEY = "spanish_deep_reader_lessons_v1";

    function loadPersistedLessons() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(INITIAL_LESSONS);
        const parsed = JSON.parse(raw);
        const list = Array.isArray(parsed)
          ? parsed
          : (Array.isArray(parsed.lessons) ? parsed.lessons : null);
        if (!list || list.length === 0) return structuredClone(INITIAL_LESSONS);
        return list.map((item, idx) => validateAndNormalizeLesson(item, idx));
      } catch (e) {
        return structuredClone(INITIAL_LESSONS);
      }
    }

    function persistLessons(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          savedAt: new Date().toISOString(),
          lessons: list
        }));
      } catch (e) {
        ioStatus = {
          type: "bad",
          message: "本機儲存空間已滿或受限，請改用「匯出文章 (JSON)」備份。"
        };
      }
    }

    function toSyncCode(list) {
      const jsonStr = JSON.stringify(list);
      const bytes = new TextEncoder().encode(jsonStr);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function fromSyncCode(codeStr) {
      const trimmed = String(codeStr || "").trim();
      if (!trimmed) throw new Error("請先貼上同步碼。");
      const b64 = trimmed.replace(/-/g, "+").replace(/_/g, "/");
      const pad = b64.length % 4 ? "=".repeat(4 - (b64.length % 4)) : "";
      const bin = atob(b64 + pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      const parsed = JSON.parse(jsonStr);
      return Array.isArray(parsed)
        ? parsed
        : (Array.isArray(parsed.lessons) ? parsed.lessons : [parsed]);
    }

    function mergeImportedLessons(rawList) {
      const normalizedList = rawList.map((item, idx) =>
        validateAndNormalizeLesson(item, lessons.length + idx)
      );

      let addedCount = 0;
      let updatedCount = 0;
      let lastTouchedIndex = currentIndex;

      normalizedList.forEach((newLesson) => {
        const existingIdx = lessons.findIndex(l => l.id === newLesson.id);
        if (existingIdx >= 0) {
          newLesson.unitLabel = lessons[existingIdx].unitLabel;
          lessons[existingIdx] = newLesson;
          delete shuffledQuizCache[existingIdx];
          updatedCount++;
          lastTouchedIndex = existingIdx;
        } else {
          newLesson.unitLabel = `第 ${lessons.length + 1} 篇`;
          lessons.push(newLesson);
          addedCount++;
          lastTouchedIndex = lessons.length - 1;
        }
      });

      persistLessons(lessons);
      currentIndex = lastTouchedIndex;
      showCa = false;
      showZh = false;
      showEn = false;
      ioStatus = {
        type: "ok",
        message: `已儲存並更新：新增 ${addedCount} 篇、更新 ${updatedCount} 篇（目前共 ${lessons.length} 篇，重新整理不遺失）。`
      };
      render();
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      availableVoices = window.speechSynthesis.getVoices() || [];
      const esVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("es"));
      const caVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ca"));
      const enVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));

      if (!selectedEsVoiceURI && esVoices.length > 0) selectedEsVoiceURI = esVoices[0].voiceURI;
      if (!selectedCaVoiceURI && caVoices.length > 0) selectedCaVoiceURI = caVoices[0].voiceURI;
      if (!selectedEnVoiceURI && enVoices.length > 0) selectedEnVoiceURI = enVoices[0].voiceURI;
      render();
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function updateSpeechStatusLabel() {
      const el = document.getElementById("speechStatusText");
      if (!el) return;
      if (speechState === "speaking-es") el.textContent = "正在朗讀西文...";
      else if (speechState === "speaking-ca") el.textContent = "正在朗讀加泰隆尼亞文...";
      else if (speechState === "speaking-en") el.textContent = "正在朗讀英文...";
      else if (speechState === "paused") el.textContent = "已暫停朗讀";
      else el.textContent = "待命／已停止";
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      speechState = "idle";
      updateSpeechStatusLabel();
    }

    function togglePauseSpeech() {
      if (!("speechSynthesis" in window)) return;
      if (speechState === "paused") {
        window.speechSynthesis.resume();
        speechState = `speaking-${activeSpeechLang}`;
        updateSpeechStatusLabel();
      } else if (speechState.startsWith("speaking-")) {
        window.speechSynthesis.pause();
        speechState = "paused";
        updateSpeechStatusLabel();
      }
    }

    function startSpeech(paragraphs, langMode) {
      if (!("speechSynthesis" in window)) {
        alert("你的瀏覽器不支援語音朗讀功能。");
        return;
      }
      const text = (paragraphs || []).join(" ").trim();
      if (!text) return;

      window.speechSynthesis.cancel();
      activeSpeechLang = langMode;

      const utter = new SpeechSynthesisUtterance(text);
      const uriMap = {
        es: selectedEsVoiceURI,
        ca: selectedCaVoiceURI,
        en: selectedEnVoiceURI
      };
      const fallbackLangMap = {
        es: "es-ES",
        ca: "ca-ES",
        en: "en-US"
      };
      const chosenVoice = availableVoices.find(v => v.voiceURI === uriMap[langMode]);

      if (chosenVoice) {
        utter.voice = chosenVoice;
        utter.lang = chosenVoice.lang;
      } else {
        utter.lang = fallbackLangMap[langMode] || "es-ES";
      }
      utter.rate = 0.94;

      utter.onstart = () => {
        speechState = `speaking-${langMode}`;
        updateSpeechStatusLabel();
      };
      utter.onend = () => {
        speechState = "idle";
        updateSpeechStatusLabel();
      };
      utter.onerror = () => {
        speechState = "idle";
        updateSpeechStatusLabel();
      };

      speechState = `speaking-${langMode}`;
      updateSpeechStatusLabel();
      window.speechSynthesis.speak(utter);
    }

    function applyMotionPreference() {
      const systemReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const isReduced = manualReducedMotion || systemReduced;
      document.body.classList.toggle("reduced-motion", manualReducedMotion);

      if (illusTimerId) {
        clearInterval(illusTimerId);
        illusTimerId = null;
      }
      if (autoRotateIllus && !isReduced) {
        illusTimerId = setInterval(() => {
          currentIllus = pickSeasonalIllustration(currentIllus.id);
          render();
        }, 12000);
      }
    }

    function buildShuffledQuiz(quizList) {
      return quizList.map((qItem) => {
        const indices = qItem.esOpts.map((_, idx) => idx);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        return {
          ...qItem,
          esOpts: indices.map(i => qItem.esOpts[i]),
          caOpts: indices.map(i => (qItem.caOpts || qItem.esOpts)[i]),
          enOpts: indices.map(i => (qItem.enOpts || qItem.esOpts)[i]),
          zhOpts: indices.map(i => qItem.zhOpts[i]),
          answer: indices.indexOf(qItem.answer)
        };
      });
    }

    function getActiveQuiz(lessonIndex) {
      if (!shuffledQuizCache[lessonIndex]) {
        shuffledQuizCache[lessonIndex] = buildShuffledQuiz(lessons[lessonIndex].quiz);
      }
      return shuffledQuizCache[lessonIndex];
    }

    function exportLessonsJson() {
      const payload = {
        exportedAt: new Date().toISOString(),
        level: "A2",
        count: lessons.length,
        lessons
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `spanish-catalan-lessons-a2-${lessons.length}-units.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      ioStatus = {
        type: "ok",
        message: `已匯出 ${lessons.length} 篇學習單元為 JSON 檔案（可傳至手機再匯入）。`
      };
      render();
    }

    function validateAndNormalizeLesson(item, fallbackIndex) {
      if (!item || typeof item !== "object" || !item.title) {
        throw new Error(`第 ${fallbackIndex + 1} 筆資料缺少標題（title）。`);
      }
      const esParagraphs = Array.isArray(item.esParagraphs)
        ? item.esParagraphs
        : (typeof item.es === "string" ? [item.es] : []);
      if (esParagraphs.length === 0) {
        throw new Error(`「${item.title}」缺少西文段落內容（esParagraphs）。`);
      }
      return {
        id: item.id || `custom-${Date.now()}-${fallbackIndex}`,
        unitLabel: item.unitLabel || `第 ${fallbackIndex + 1} 篇`,
        topic: item.topic || "自訂主題",
        level: item.level || "A2 初級",
        duration: item.duration || "約 30 分鐘單元",
        title: item.title,
        caTitle: item.caTitle || "",
        esParagraphs,
        caParagraphs: Array.isArray(item.caParagraphs) ? item.caParagraphs : [],
        zhParagraphs: Array.isArray(item.zhParagraphs)
          ? item.zhParagraphs
          : (typeof item.zh === "string" ? [item.zh] : []),
        enParagraphs: Array.isArray(item.enParagraphs)
          ? item.enParagraphs
          : (typeof item.en === "string" ? [item.en] : []),
        vocab: Array.isArray(item.vocab) ? item.vocab : [],
        phrases: Array.isArray(item.phrases) ? item.phrases : [],
        grammar: Array.isArray(item.grammar) ? item.grammar : [],
        quiz: Array.isArray(item.quiz) ? item.quiz : []
      };
    }

    function handleImportFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(String(e.target.result));
          const rawList = Array.isArray(parsed)
            ? parsed
            : (Array.isArray(parsed.lessons) ? parsed.lessons : [parsed]);
          mergeImportedLessons(rawList);
        } catch (err) {
          ioStatus = {
            type: "bad",
            message: `匯入失敗：${err.message || "請確認 JSON 格式是否正確。"}`
          };
          render();
        }
      };
      reader.readAsText(file, "utf-8");
    }

      return list.map(v => {

            <span>${lesson.unitLabel} · 可重複閱讀與複習</span>
          </div>
          <h1>${lesson.title}</h1>

          <div class="es-text" id="esParagraphs">
            ${lesson.esParagraphs.map(p => `<p>${p}</p>`).join("")}
          </div>

          <div class="audio-panel">
            <div class="audio-controls-row">
              <button type="button" class="primary" id="playEsBtn">朗讀西文</button>
              <button type="button" id="playCaBtn">朗讀加泰隆尼亞文</button>
              <button type="button" id="playEnBtn">朗讀英文</button>
              <button type="button" id="pauseSpeechBtn">${speechState === "paused" ? "繼續朗讀" : "暫停朗讀"}</button>
              <button type="button" id="stopSpeechBtn">停止朗讀</button>
              <span id="speechStatusText" class="speech-status">待命／已停止</span>
            </div>
            <div class="voice-select-row">
              <label class="voice-field">
                <span>西文聲線：</span>
                <select id="esVoiceSelect">${buildVoiceOptions("es", selectedEsVoiceURI)}</select>
              </label>
              <label class="voice-field">
                <span>加泰隆尼亞文聲線：</span>
                <select id="caVoiceSelect">${buildVoiceOptions("ca", selectedCaVoiceURI)}</select>
              </label>
              <label class="voice-field">
                <span>英文聲線：</span>
                <select id="enVoiceSelect">${buildVoiceOptions("en", selectedEnVoiceURI)}</select>
              </label>
            </div>
          </div>

          <div class="audio-controls-row" style="margin-top: 12px;">
            <button type="button" id="toggleCaBtn" class="${showCa ? "active-pill" : ""}">
              ${showCa ? "隱藏加泰隆尼亞文" : "顯示加泰隆尼亞文"}
            </button>
            <button type="button" id="toggleZhBtn" class="${showZh ? "active-pill" : ""}">
              ${showZh ? "隱藏中文翻譯" : "顯示中文翻譯"}
            </button>
            <button type="button" id="toggleEnBtn" class="${showEn ? "active-pill" : ""}">
              ${showEn ? "隱藏英文翻譯" : "顯示英文翻譯"}
            </button>
          </div>

          ${showCa && lesson.caParagraphs && lesson.caParagraphs.length ? `
            <div class="ca-text">
              <span class="trans-label">加泰隆尼亞文（Català）${lesson.caTitle ? ` — ${lesson.caTitle}` : ""}</span>
              ${lesson.caParagraphs.map(p => `<p>${p}</p>`).join("")}
            </div>
          ` : ""}

          ${showZh && lesson.zhParagraphs.length ? `
            <div class="zh-text">
              <span class="trans-label">中文翻譯（Traducción al chino）</span>
              ${lesson.zhParagraphs.map(p => `<p>${p}</p>`).join("")}
            </div>
          ` : ""}

          ${showEn && lesson.enParagraphs.length ? `
            <div class="en-text">
              <span class="trans-label">英文翻譯（English translation）</span>
              ${lesson.enParagraphs.map(p => `<p>${p}</p>`).join("")}
            </div>
          ` : ""}
        </section>

        <section id="vocabSection" class="card">
          <h2>重要單字與歷史淵源</h2>
          <div class="grid-2">
            ${lesson.vocab.map(v => `
              <div class="item-box">
                <div class="item-head">
                  <span class="es-word">${v.word}</span>
                  <span class="pos">${v.pos}</span>
                </div>
                ${v.caWord ? `<div class="ca-box"><strong>加泰隆尼亞文：</strong>${v.caWord}${v.caExample ? `<br /><em>${v.caExample}</em>` : ""}</div>` : ""}
                <div class="meaning-line"><strong>釋義：</strong>${v.meaning}</div>
                <div class="example"><strong>例句：</strong>${v.example}</div>
                ${v.origin ? `<div class="origin-box"><strong>歷史／詞源淵源：</strong>${v.origin}</div>` : ""}
              </div>
            `).join("")}
          </div>
        </section>

        <section id="phrasesSection" class="card">
          <h2>實用片語與歷史淵源</h2>
          <div class="grid-2">
            ${lesson.phrases.map(p => `
              <div class="item-box">
                <div class="item-head">
                  <span class="es-word">${p.phrase}</span>
                </div>
                ${p.caPhrase ? `<div class="ca-box"><strong>加泰隆尼亞文：</strong>${p.caPhrase}${p.caExample ? `<br /><em>${p.caExample}</em>` : ""}</div>` : ""}
                <div class="meaning-line"><strong>釋義：</strong>${p.meaning}</div>
                <div class="example"><strong>例句：</strong>${p.example}</div>
                ${p.origin ? `<div class="origin-box"><strong>歷史／詞源淵源：</strong>${p.origin}</div>` : ""}
              </div>
            `).join("")}
          </div>
        </section>

        <section id="grammarSection" class="card">
          <h2>文法重點</h2>
          ${lesson.grammar.map(g => `
            <div class="grammar-box">
              <h3 style="margin-bottom: 6px;">${g.title}</h3>
              <p style="margin: 0 0 8px;">${g.explanation}</p>
              <div class="example"><strong>西文例句：</strong>${g.example}</div>
              ${g.caExample ? `<div class="ca-box" style="margin-top: 8px;"><strong>加泰隆尼亞文對照：</strong>${g.caExample}</div>` : ""}
            </div>
          `).join("")}
        </section>

        <section id="quizSection" class="card">
          <div class="quiz-header">
            <div>
              <h2 style="margin-bottom: 4px;">測驗</h2>
              <div class="review-note">${getQuizModeLabel()}</div>
            </div>
            <div class="lang-switch">
              <button type="button" id="langEsBtn" class="${quizLang === "es" ? "active-pill" : ""}">西文版</button>
              <button type="button" id="langCaBtn" class="${quizLang === "ca" ? "active-pill" : ""}">加泰隆尼亞文版</button>
              <button type="button" id="langEnBtn" class="${quizLang === "en" ? "active-pill" : ""}">英文版</button>
              <button type="button" id="langZhBtn" class="${quizLang === "zh" ? "active-pill" : ""}">中文版</button>
            </div>
          </div>

          <form id="quizForm">
            ${activeQuiz.map((qItem, qIdx) => {
              const promptText = getQuizQuestionText(qItem);
              const opts = getQuizOptions(qItem);
              return `
                <div class="quiz-q">
                  <div style="font-weight: 600;">${promptText}</div>
                  <div class="options">
                    ${opts.map((opt, oIdx) => `
                      <label class="option-label">
                        <input type="radio" name="q${qIdx}" value="${oIdx}" />
                        <span>${opt}</span>
                      </label>
                    `).join("")}
                  </div>
                  <div id="feedback-${qIdx}"></div>
                </div>
              `;
            }).join("")}

            <div class="quiz-actions">
              <button type="submit" class="primary">提交測驗</button>
              <button type="button" id="resetQuizBtn">重新洗牌作答／複習</button>
              <span id="scoreSummary" style="font-weight: 700;"></span>
            </div>
          </form>
        </section>
      `;

      syncHeaderOffset();
      updateSpeechStatusLabel();

      // 插畫上一張／下一張與選單開關
      document.getElementById("prevIllusBtn").addEventListener("click", () => {
        const idx = BCN_ILLUSTRATIONS.findIndex(i => i.id === currentIllus.id);
        const prevIdx = (idx - 1 + BCN_ILLUSTRATIONS.length) % BCN_ILLUSTRATIONS.length;
        currentIllus = BCN_ILLUSTRATIONS[prevIdx];
        render();
      });

      document.getElementById("nextIllusBtn").addEventListener("click", () => {
        const idx = BCN_ILLUSTRATIONS.findIndex(i => i.id === currentIllus.id);
        const nextIdx = (idx + 1) % BCN_ILLUSTRATIONS.length;
        currentIllus = BCN_ILLUSTRATIONS[nextIdx];
        render();
      });

      document.getElementById("toggleIllusMenuBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        illusMenuOpen = !illusMenuOpen;
        render();
      });

      document.getElementById("randomIllusBtn").addEventListener("click", () => {
        currentIllus = pickSeasonalIllustration(currentIllus.id);
        render();
      });

      document.getElementById("toggleGalleryBtn").addEventListener("click", () => {
        galleryOpen = !galleryOpen;
        render();
      });

      document.querySelectorAll("[data-pick-illus]").forEach(btn => {
        btn.addEventListener("click", () => {
          const picked = BCN_ILLUSTRATIONS.find(i => i.id === btn.getAttribute("data-pick-illus"));
          if (picked) {
            currentIllus = picked;
            render();
          }
        });
      });

      document.getElementById("toggleAutoIllusBtn").addEventListener("click", () => {
        autoRotateIllus = !autoRotateIllus;
        applyMotionPreference();
        render();
      });

      document.getElementById("toggleMotionBtn").addEventListener("click", () => {
        manualReducedMotion = !manualReducedMotion;
        applyMotionPreference();
        render();
      });

      // JSON 匯入／匯出與跨裝置同步碼
      document.getElementById("exportJsonBtn").addEventListener("click", exportLessonsJson);
      const fileInput = document.getElementById("jsonFileInput");
      document.getElementById("importJsonBtn").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          handleImportFile(e.target.files[0]);
          e.target.value = "";
        }
      });
      document.getElementById("resetDefaultBtn").addEventListener("click", resetBuiltInLessons);

      document.getElementById("toggleSyncBtn").addEventListener("click", () => {
        syncDrawerOpen = !syncDrawerOpen;
        render();
      });

      const syncArea = document.getElementById("syncCodeTextarea");
      if (syncArea) {
        syncArea.addEventListener("input", (e) => {
          syncCodeText = e.target.value;
        });
      }

      document.getElementById("genSyncCodeBtn").addEventListener("click", () => {
        syncCodeText = toSyncCode(lessons);
        ioStatus = {
          type: "ok",
          message: `已產生目前 ${lessons.length} 篇的跨裝置同步碼，請複製並傳到手機套用。`
        };
        render();
      });

      document.getElementById("copySyncCodeBtn").addEventListener("click", () => {
        const val = syncCodeText || toSyncCode(lessons);
        syncCodeText = val;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(val).then(() => {
            ioStatus = { type: "ok", message: "已複製同步碼到剪貼簿！" };
            render();
          }).catch(() => {
            ioStatus = { type: "ok", message: "請手動全選下方同步碼並複製。" };
            render();
          });
        } else {
          ioStatus = { type: "ok", message: "請手動全選下方同步碼並複製。" };
          render();
        }
      });

      document.getElementById("applySyncCodeBtn").addEventListener("click", () => {
        try {
          const rawList = fromSyncCode(syncCodeText);
          mergeImportedLessons(rawList);
        } catch (err) {
          ioStatus = {
            type: "bad",
            message: `同步碼套用失敗：${err.message || "請確認同步碼是否完整。"}`
          };
          render();
        }
      });

      // 朗讀、暫停、停止與聲線選擇
      document.getElementById("playEsBtn").addEventListener("click", () => startSpeech(lesson.esParagraphs, "es"));
      document.getElementById("playCaBtn").addEventListener("click", () => {
        const caList = lesson.caParagraphs && lesson.caParagraphs.length ? lesson.caParagraphs : lesson.esParagraphs;
        startSpeech(caList, "ca");
      });
      document.getElementById("playEnBtn").addEventListener("click", () => startSpeech(lesson.enParagraphs, "en"));

      document.getElementById("pauseSpeechBtn").addEventListener("click", () => {
        togglePauseSpeech();
        document.getElementById("pauseSpeechBtn").textContent =
          speechState === "paused" ? "繼續朗讀" : "暫停朗讀";
      });
      document.getElementById("stopSpeechBtn").addEventListener("click", () => {
        stopSpeech();
        document.getElementById("pauseSpeechBtn").textContent = "暫停朗讀";
      });

      document.getElementById("esVoiceSelect").addEventListener("change", (e) => {
        selectedEsVoiceURI = e.target.value;
      });
      document.getElementById("caVoiceSelect").addEventListener("change", (e) => {
        selectedCaVoiceURI = e.target.value;
      });
      document.getElementById("enVoiceSelect").addEventListener("change", (e) => {
        selectedEnVoiceURI = e.target.value;
      });

      // 翻譯開關
      document.getElementById("toggleCaBtn").addEventListener("click", () => {
        showCa = !showCa;
        render();
      });
      document.getElementById("toggleZhBtn").addEventListener("click", () => {
        showZh = !showZh;
        render();
      });
      document.getElementById("toggleEnBtn").addEventListener("click", () => {
        showEn = !showEn;
        render();
      });

      // 測驗語系切換與批改
      document.getElementById("langEsBtn").addEventListener("click", () => {
        quizLang = "es";
        render();
      });
      document.getElementById("langCaBtn").addEventListener("click", () => {
        quizLang = "ca";
        render();
      });
      document.getElementById("langEnBtn").addEventListener("click", () => {
        quizLang = "en";
        render();
      });
      document.getElementById("langZhBtn").addEventListener("click", () => {
        quizLang = "zh";
        render();
      });
      document.getElementById("resetQuizBtn").addEventListener("click", () => {
        delete shuffledQuizCache[currentIndex];
        render();
      });

      document.getElementById("quizForm").addEventListener("submit", (e) => {
        e.preventDefault();
        let score = 0;

        activeQuiz.forEach((qItem, qIdx) => {
          const opts = getQuizOptions(qItem);
          const explain = getQuizExplain(qItem);
          const selected = document.querySelector(`input[name="q${qIdx}"]:checked`);
          const fbEl = document.getElementById(`feedback-${qIdx}`);

          if (!selected) {
            fbEl.className = "feedback bad";
            if (quizLang === "ca") {
              fbEl.textContent = `Sense respondre. Resposta correcta: "${opts[qItem.answer]}". ${explain}`;
            } else if (quizLang === "en") {
              fbEl.textContent = `Unanswered. Correct answer: "${opts[qItem.answer]}". ${explain}`;
            } else if (quizLang === "zh") {
              fbEl.textContent = `尚未作答。正確答案是：「${opts[qItem.answer]}」。${explain}`;
            } else {
              fbEl.textContent = `Sin responder. Respuesta correcta: "${opts[qItem.answer]}". ${explain}`;
            }
            return;
          }

          const val = Number(selected.value);
          if (val === qItem.answer) {
            score++;
            fbEl.className = "feedback ok";
            if (quizLang === "ca") {
              fbEl.textContent = `Molt bé! ${explain}`;
            } else if (quizLang === "en") {
              fbEl.textContent = `Correct! ${explain}`;
            } else if (quizLang === "zh") {
              fbEl.textContent = `答對了！${explain}`;
            } else {
              fbEl.textContent = `¡Correcto! ${explain}`;
            }
          } else {
            fbEl.className = "feedback bad";
            if (quizLang === "ca") {
              fbEl.textContent = `Incorrecte. Resposta correcta: "${opts[qItem.answer]}". ${explain}`;
            } else if (quizLang === "en") {
              fbEl.textContent = `Incorrect. Correct answer: "${opts[qItem.answer]}". ${explain}`;
            } else if (quizLang === "zh") {
              fbEl.textContent = `再接再厲！正確答案是：「${opts[qItem.answer]}」。${explain}`;
            } else {
              fbEl.textContent = `Incorrecto. Respuesta correcta: "${opts[qItem.answer]}". ${explain}`;
            }
          }
        });

        const summaryEl = document.getElementById("scoreSummary");
        if (quizLang === "ca") {
          summaryEl.textContent = `Puntuació: ${score} / ${activeQuiz.length}`;
        } else if (quizLang === "en") {
          summaryEl.textContent = `Score: ${score} / ${activeQuiz.length}`;
        } else if (quizLang === "zh") {
          summaryEl.textContent = `得分：${score} / ${activeQuiz.length}`;
        } else {
          summaryEl.textContent = `Puntuación: ${score} / ${activeQuiz.length}`;
        }
      });
    }

    // 點擊外部收合插畫選單
    document.addEventListener("click", (e) => {
      if (illusMenuOpen && !e.target.closest(".bcn-menu-wrap")) {
        illusMenuOpen = false;
        const dd = document.getElementById("illusControlsDropdown");
        const btn = document.getElementById("toggleIllusMenuBtn");
        if (dd) dd.classList.remove("open");
        if (btn) {
          btn.classList.remove("active-pill");
          btn.textContent = "插畫選單 ▾";
        }
      }
    });

    // 文章總覽彈窗開關
    openOverviewMenuBtn.addEventListener("click", () => {
      setOverviewMenu(!overviewMenuOpen);
    });
    closeOverviewMenuBtn.addEventListener("click", () => {
      setOverviewMenu(false);
    });
    overviewBackdrop.addEventListener("click", () => {
      setOverviewMenu(false);
    });

    function jumpToSection(target) {
      setOverviewMenu(false);
      if (target === "top") {
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      const map = {
        article: "articleSection",
        vocab: "vocabSection",
        phrases: "phrasesSection",
        grammar: "grammarSection",
        quiz: "quizSection"
      };
      const targetEl = document.getElementById(map[target]);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    document.querySelectorAll("[data-jump]").forEach(btn => {
      btn.addEventListener("click", () => {
        jumpToSection(btn.getAttribute("data-jump"));
      });
    });

    function switchLesson(newIndex) {
      if (newIndex >= 0 && newIndex < lessons.length) {
        stopSpeech();
        currentIndex = newIndex;
        showCa = false;
        showZh = false;
        showEn = false;
        ioStatus = { type: "", message: "" };
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    prevBtn.addEventListener("click", () => switchLesson(currentIndex - 1));
    nextBtn.addEventListener("click", () => switchLesson(currentIndex + 1));

    scrollTopBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.addEventListener("resize", syncHeaderOffset);

    applyMotionPreference();
    render();
  </script>
</body>
</html>
