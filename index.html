<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西文深度閱讀與複習站（30 分鐘版 · A2）</title>
  <style>
    :root {
      --primary: #d9480f;
      --primary-light: #fff4e6;
      --accent: #1971c2;
      --accent-light: #e7f5ff;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #212529;
      --muted: #5c6670;
      --border: #dee2e6;
      --success: #2b8a3e;
      --success-bg: #ebfbee;
      --danger: #c92a2a;
      --danger-bg: #fff5f5;
      --origin-bg: #f8f0fc;
      --origin-border: #e5dbff;
      --origin-text: #5f3dc4;
      --grammar-bg: #fff9db;
      --grammar-border: #ffe066;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }

    .header-inner {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) { background: #f1f3f5; }
    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: #c2410c; }

    button.secondary-active {
      background: var(--accent-light);
      color: var(--accent);
      border-color: #74c0fc;
      font-weight: 600;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    main {
      max-width: 1020px;
      margin: 24px auto;
      padding: 0 20px 96px;
      display: grid;
      gap: 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* 文章選單面板 */
    .article-menu-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      display: none;
    }
    .article-menu-panel.open {
      display: block;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .menu-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 12px;
    }

    .menu-item-btn {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fcfcfd;
    }
    .menu-item-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .menu-item-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .menu-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .menu-item-es {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text);
    }

    .menu-item-topic {
      font-size: 0.84rem;
      color: var(--accent);
      font-weight: 600;
    }

    .io-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
    }

    .io-title {
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--text);
    }

    .io-desc {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .io-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .io-status {
      width: 100%;
      font-size: 0.88rem;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }
    .io-status.show { display: block; }
    .io-status.ok {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #b2f2bb;
    }
    .io-status.bad {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #ffc9c9;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .topic-badge {
      background: var(--accent-light);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .time-badge {
      background: #edf2ff;
      color: #364fc7;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    h1, h2, h3 { margin-top: 0; }
    h1 { font-size: 1.55rem; margin-bottom: 10px; }
    h2 {
      font-size: 1.22rem;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }

    .es-text {
      font-size: 1.12rem;
      background: #fcfcfd;
      border: 1px solid #e9ecef;
      border-radius: 10px;
      padding: 18px 20px;
      margin: 12px 0;
    }

    .es-text p { margin: 0 0 14px; }
    .es-text p:last-child { margin-bottom: 0; }

    .zh-text {
      background: #f8f9fa;
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      color: #2b2f36;
      margin-top: 12px;
    }

    .en-text {
      background: #f4f9ff;
      border-left: 4px solid var(--accent);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      color: #1c355e;
      margin-top: 12px;
    }

    .zh-text p, .en-text p { margin: 0 0 10px; }
    .zh-text p:last-child, .en-text p:last-child { margin-bottom: 0; }

    .trans-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: block;
      opacity: 0.85;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .item-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .es-word {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .pos {
      font-size: 0.8rem;
      color: var(--muted);
      background: #f1f3f5;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .meaning-line { font-size: 0.95rem; }

    .example {
      font-size: 0.9rem;
      color: var(--muted);
      background: #f8f9fa;
      padding: 8px 10px;
      border-radius: 8px;
    }

    .origin-box {
      font-size: 0.86rem;
      color: var(--origin-text);
      background: var(--origin-bg);
      border: 1px solid var(--origin-border);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .grammar-box {
      background: var(--grammar-bg);
      border: 1px solid var(--grammar-border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .grammar-box:last-child { margin-bottom: 0; }

    .quiz-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .lang-switch { display: flex; gap: 8px; }

    .quiz-q {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border);
    }
    .quiz-q:last-of-type { border-bottom: none; }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.94rem;
    }
    .option-label:hover { background: #f8f9fa; }

    .feedback {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
    }
    .feedback.ok { background: var(--success-bg); color: var(--success); border: 1px solid #b2f2bb; }
    .feedback.bad { background: var(--danger-bg); color: var(--danger); border: 1px solid #ffc9c9; }

    .quiz-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .review-note {
      font-size: 0.88rem;
      color: var(--muted);
    }

    /* 常駐右下角純向上箭頭按鈕 */
    .scroll-top-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 30;
      width: 48px;
      height: 48px;
      padding: 0;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 6px 18px rgba(217, 72, 15, 0.28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .scroll-top-btn:hover {
      background: #c2410c;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">🇪🇸 西文深度閱讀站（30 分鐘版 · 手動切換）</div>
      <div class="nav-controls">
        <button type="button" id="toggleMenuBtn" class="secondary-active">📚 文章選單</button>
        <button type="button" id="prevBtn">← 上一篇</button>
        <span id="currentUnitLabel" style="font-weight: 600; font-size: 0.92rem;">第 1 篇</span>
        <button type="button" id="nextBtn">下一篇 →</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <button type="button" id="scrollTopBtn" class="scroll-top-btn" aria-label="回到最上方" title="回到最上方">
    ↑
  </button>

  <script>
    const INITIAL_LESSONS = [
      {
        id: "ia-trabajo-educacion",
        unitLabel: "第 1 篇",
        topic: "科技、AI 與學習生活",
        level: "A2 初級",
        duration: "約 30 分鐘單元",
        title: "El impacto de la inteligencia artificial en el trabajo y la educación",
        esParagraphs: [
          "En los últimos años, la inteligencia artificial ha cambiado la forma en que trabajamos y estudiamos. En muchas oficinas, los empleados usan programas inteligentes para resumir informes largos, organizar agendas y responder correos sencillos. Así, ganan tiempo para tareas que necesitan más creatividad y conversación con otras personas.",
          "En las escuelas y universidades, el cambio también es visible. Muchos estudiantes piden ayuda a un asistente digital cuando no entienden un tema de historia, ciencias o idiomas. El sistema explica las ideas paso a paso y propone ejercicios nuevos para practicar en casa.",
          "Sin embargo, los profesores y las empresas recuerdan que la tecnología no piensa por sí sola. A veces, una herramienta automática comete errores o da respuestas poco claras. Por eso, es necesario revisar la información con cuidado y comprobar los datos en fuentes confiables.",
          "En la vida diaria de Valeria, profesora de secundaria, la inteligencia artificial es una aliada útil pero limitada. Ella prepara actividades variadas con ayuda digital, pero prefiere corregir los textos de sus alumnos de manera personal para conocer su estilo y animarlos de verdad.",
          "Al final, el verdadero aprendizaje depende de la curiosidad, el esfuerzo constante y el diálogo humano. Las herramientas digitales abren puertas rápidas, pero las personas son quienes deciden cómo usarlas con responsabilidad y buen criterio."
        ],
        zhParagraphs: [
          "近幾年來，人工智慧改變了我們工作與學習的方式。在許多辦公室裡，員工使用智慧程式來摘要長篇報告、安排行程與回覆簡單的郵件。如此一來，他們就能省下時間，去做需要更多創意與人際溝通的工作。",
          "在學校與大學裡，這項轉變同樣清晰可見。當學生對歷史、科學或語言的某個主題不理解時，許多人會向數位助理求助。系統會一步步解釋概念，並提供新的練習題讓學生在家練習。",
          "然而，老師與企業也提醒大家，科技並不會自己獨立思考。有時候，自動化工具會犯錯，或給出不夠清楚的答案。因此，仔細檢視資訊並在可信賴的來源核對資料是必要的。",
          "在高中老師瓦萊麗亞的日常生活中，人工智慧是一個有用但有限度的幫手。她會藉助數位工具準備多樣的活動，但仍喜歡親自批改學生的作文，以便了解他們的風格並給予真正的鼓勵。",
          "歸根究柢，真正的學習取決於好奇心、持續的努力以及人與人的對話。數位工具能快速開啟大門，但如何負責任且明智地使用它們，決定權仍在人身上。"
        ],
        enParagraphs: [
          "In recent years, artificial intelligence has changed the way we work and study. In many offices, employees use smart programs to summarize long reports, organize schedules, and reply to simple emails. That way, they save time for tasks that require more creativity and conversation with other people.",
          "In schools and universities, the change is also visible. Many students ask a digital assistant for help when they do not understand a topic in history, science, or languages. The system explains ideas step by step and suggests new exercises to practice at home.",
          "However, teachers and companies remind us that technology does not think on its own. Sometimes an automatic tool makes mistakes or gives unclear answers. Because of that, it is necessary to review information carefully and check facts in reliable sources.",
          "In the daily life of Valeria, a high school teacher, artificial intelligence is a useful yet limited ally. She prepares varied activities with digital help, but she prefers grading her students' texts personally to understand their style and truly encourage them.",
          "In the end, real learning depends on curiosity, steady effort, and human dialogue. Digital tools open doors quickly, but people are the ones who decide how to use them responsibly and with good judgment."
        ],
        vocab: [
          {
            word: "resumir",
            pos: "動詞",
            meaning: "摘要、概述、總結（EN: summarize）",
            example: "En esta reunión vamos a resumir los puntos principales.",
            origin: "源自拉丁文 resumere（重新取回、再次拿起），引申為把長篇內容濃縮提煉出重點。"
          },
          {
            word: "el informe",
            pos: "名詞(陽)",
            meaning: "報告、報告書（EN: report）",
            example: "El equipo presentó un informe claro al final del mes.",
            origin: "源自動詞 informar（告知、報告），源自拉丁文 informare（塑造、說明）。"
          },
          {
            word: "la tarea",
            pos: "名詞(陰)",
            meaning: "工作任務、作業（EN: task / homework）",
            example: "Termino mis tareas de la tarde antes de cenar.",
            origin: "源自阿拉伯文 tariha（被交付的事、負擔），經由古西班牙文傳入，指分配到的工作或功課。"
          },
          {
            word: "comprobar",
            pos: "動詞",
            meaning: "核對、查證、確認（EN: check / verify）",
            example: "Siempre compruebo la hora del tren antes de salir.",
            origin: "由前綴 com-（完全／一起）加上 probar（測試、證明）構成，指透過比對或測試來確認真偽。"
          },
          {
            word: "la fuente",
            pos: "名詞(陰)",
            meaning: "來源、消息來源、噴泉（EN: source / fountain）",
            example: "Busca siempre información en una fuente confiable.",
            origin: "源自拉丁文 fons / fontis（泉水、水源），後來引申為知識、資料或事物的「源頭」。"
          },
          {
            word: "confiable",
            pos: "形容詞",
            meaning: "可信賴的、可靠的（EN: reliable）",
            example: "Necesitamos una fuente confiable para este trabajo.",
            origin: "源自動詞 confiar（信任、託付），加上表示「能夠……的」字尾 -able 構成。"
          },
          {
            word: "variado/a",
            pos: "形容詞",
            meaning: "多樣的、豐富的（EN: varied / diverse）",
            example: "Preparamos ejercicios variados para toda la semana.",
            origin: "源自拉丁文 varius（多樣的、斑駁的），指具有不同類型或變化。"
          },
          {
            word: "la curiosidad",
            pos: "名詞(陰)",
            meaning: "好奇心（EN: curiosity）",
            example: "La curiosidad ayuda a hacer buenas preguntas.",
            origin: "源自拉丁文 curiositas，與 curiosus（留心的、渴望知道的）相關，原意帶有「用心探究」的積極色彩。"
          },
          {
            word: "el esfuerzo",
            pos: "名詞(陽)",
            meaning: "努力、心力（EN: effort）",
            example: "Su esfuerzo diario dio buenos resultados.",
            origin: "由前綴 es-（向外／充分）與 fuerza（力量、體力）構成，指把力量投入某件事上。"
          },
          {
            word: "el criterio",
            pos: "名詞(陽)",
            meaning: "判斷標準、見識（EN: criterion / judgment）",
            example: "Necesitamos criterio para elegir buenas noticias.",
            origin: "源自古希臘文 kriterion（判斷的標準、衡量工具），與 krinein（分辨、決定）同源。"
          }
        ],
        phrases: [
          {
            phrase: "en los últimos años",
            meaning: "在最近幾年裡（EN: in recent years）",
            example: "En los últimos años cambió mucho nuestra forma de comprar.",
            origin: "último 源自拉丁文 ultimus（最遠的、最後的），與 años（年）搭配表示「截至目前為止的最近幾年」。"
          },
          {
            phrase: "paso a paso",
            meaning: "一步一步地、循序漸進（EN: step by step）",
            example: "Explicamos el problema paso a paso en clase.",
            origin: "paso 源自拉丁文 passus（步伐），重複連接「一步接一步」，強調穩健不急躁的過程。"
          },
          {
            phrase: "por sí solo / sola",
            meaning: "靠自己、獨立地（EN: by itself / on its own）",
            example: "El programa no decide por sí solo.",
            origin: "由 por + 反身代名詞 sí + solo（獨自的）組成，用來強調某事物或某人不依賴外力。"
          },
          {
            phrase: "por eso",
            meaning: "因此、所以（EN: therefore / that is why）",
            example: "Llueve mucho; por eso llevamos paraguas.",
            origin: "由介系詞 por（由於、為了）加上指示代名詞 eso（那件事）構成，直接連接原因與結果。"
          },
          {
            phrase: "de manera personal",
            meaning: "親自地、以個人方式（EN: personally / in person）",
            example: "Prefiero hablar con él de manera personal.",
            origin: "manera 源自拉丁文 manus（手），引申為「做法、方式」，搭配 personal 強調親力親為。"
          },
          {
            phrase: "depender de algo",
            meaning: "取決於某事、依靠某事（EN: depend on something）",
            example: "El éxito del proyecto depende de todo el equipo.",
            origin: "源自拉丁文 dependere（懸掛於下、依賴於），在現代西文中表示結果或狀態由某條件決定。"
          }

    function buildShuffledQuiz(quizList) {
      return quizList.map((qItem) => {
        const indices = qItem.esOpts.map((_, idx) => idx);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        return {
          ...qItem,
          esOpts: indices.map(i => qItem.esOpts[i]),
          zhOpts: indices.map(i => qItem.zhOpts[i]),
          answer: indices.indexOf(qItem.answer)
        };
      });
    }

    function getActiveQuiz(lessonIndex) {
      if (!shuffledQuizCache[lessonIndex]) {
        shuffledQuizCache[lessonIndex] = buildShuffledQuiz(lessons[lessonIndex].quiz);
      }
      return shuffledQuizCache[lessonIndex];
    }

    function speakSpanish(paragraphs) {
      if (!("speechSynthesis" in window)) {
        alert("你的瀏覽器不支援語音朗讀功能。");
        return;
      }
      window.speechSynthesis.cancel();
      const fullText = paragraphs.join(" ");
      const utter = new SpeechSynthesisUtterance(fullText);
      utter.lang = "es-ES";
      utter.rate = 0.92;
      window.speechSynthesis.speak(utter);
    }

    function exportLessonsJson() {
      const payload = {
        exportedAt: new Date().toISOString(),
        level: "A2",
        count: lessons.length,
        lessons
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `spanish-lessons-a2-${lessons.length}-units.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      ioStatus = {
        type: "ok",
        message: `✅ 已匯出 ${lessons.length} 篇西文學習單元為 JSON 檔案。`
      };
      render();
    }

    function validateAndNormalizeLesson(item, fallbackIndex) {
      if (!item || typeof item !== "object" || !item.title) {
        throw new Error(`第 ${fallbackIndex + 1} 筆資料缺少標題（title）。`);
      }
      const esParagraphs = Array.isArray(item.esParagraphs)
        ? item.esParagraphs
        : (typeof item.es === "string" ? [item.es] : []);
      if (esParagraphs.length === 0) {
        throw new Error(`「${item.title}」缺少西文段落內容（esParagraphs）。`);
      }
      return {
        id: item.id || `custom-${Date.now()}-${fallbackIndex}`,
        unitLabel: item.unitLabel || `第 ${fallbackIndex + 1} 篇`,
        topic: item.topic || "自訂主題",
        level: item.level || "A2 初級",
        duration: item.duration || "約 30 分鐘單元",
        title: item.title,
        esParagraphs,
        zhParagraphs: Array.isArray(item.zhParagraphs)
          ? item.zhParagraphs
          : (typeof item.zh === "string" ? [item.zh] : []),
        enParagraphs: Array.isArray(item.enParagraphs)
          ? item.enParagraphs
          : (typeof item.en === "string" ? [item.en] : []),
        vocab: Array.isArray(item.vocab) ? item.vocab : [],
        phrases: Array.isArray(item.phrases) ? item.phrases : [],
        grammar: Array.isArray(item.grammar) ? item.grammar : [],
        quiz: Array.isArray(item.quiz) ? item.quiz : []
      };
    }

    function handleImportFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(String(e.target.result));
          const rawList = Array.isArray(parsed)
            ? parsed
            : (Array.isArray(parsed.lessons) ? parsed.lessons : [parsed]);

          const normalizedList = rawList.map((item, idx) =>
            validateAndNormalizeLesson(item, lessons.length + idx)
          );

          let addedCount = 0;
          let updatedCount = 0;
          let lastTouchedIndex = currentIndex;

          normalizedList.forEach((newLesson) => {
            const existingIdx = lessons.findIndex(l => l.id === newLesson.id);
            if (existingIdx >= 0) {
              newLesson.unitLabel = lessons[existingIdx].unitLabel;
              lessons[existingIdx] = newLesson;
              delete shuffledQuizCache[existingIdx];
              updatedCount++;
              lastTouchedIndex = existingIdx;
            } else {
              newLesson.unitLabel = `第 ${lessons.length + 1} 篇`;
              lessons.push(newLesson);
              addedCount++;
              lastTouchedIndex = lessons.length - 1;
            }
          });

          currentIndex = lastTouchedIndex;
          showZh = false;
          showEn = false;
          ioStatus = {
            type: "ok",
            message: `✅ 匯入完成：新增 ${addedCount} 篇、更新 ${updatedCount} 篇（目前共 ${lessons.length} 篇）。`
          };
          render();
        } catch (err) {
          ioStatus = {
            type: "bad",
            message: `❌ 匯入失敗：${err.message || "請確認 JSON 格式是否正確。"}`
          };
          render();
        }
      };
      reader.readAsText(file, "utf-8");
    }

          ${showEn && lesson.enParagraphs.length ? `
            <div class="en-text">
              <span class="trans-label">英文翻譯（English translation）</span>
              ${lesson.enParagraphs.map(p => `<p>${p}</p>`).join("")}
            </div>
          ` : ""}
        </section>

        <section class="card">
          <h2>重要單字與歷史淵源（${lesson.vocab.length} 詞 · 多詞性＋名詞 el/la 冠詞）</h2>
          <div class="grid-2">
            ${lesson.vocab.map(v => `
              <div class="item-box">
                <div class="item-head">
                  <span class="es-word">${v.word}</span>
                  <span class="pos">${v.pos}</span>
                </div>
                <div class="meaning-line"><strong>釋義：</strong>${v.meaning}</div>
                <div class="example"><strong>例句：</strong>${v.example}</div>
                ${v.origin ? `<div class="origin-box"><strong>歷史／詞源淵源：</strong>${v.origin}</div>` : ""}
              </div>
            `).join("")}
          </div>
        </section>

        <section class="card">
          <h2>實用片語與歷史淵源（${lesson.phrases.length} 組 · Expresiones）</h2>
          <div class="grid-2">
            ${lesson.phrases.map(p => `
              <div class="item-box">
                <div class="item-head">
                  <span class="es-word">${p.phrase}</span>
                </div>
                <div class="meaning-line"><strong>釋義：</strong>${p.meaning}</div>
                <div class="example"><strong>例句：</strong>${p.example}</div>
                ${p.origin ? `<div class="origin-box"><strong>歷史／詞源淵源：</strong>${p.origin}</div>` : ""}
              </div>
            `).join("")}
          </div>
        </section>

        <section class="card">
          <h2>文法重點（${lesson.grammar.length} 點 · Gramática A2）</h2>
          ${lesson.grammar.map(g => `
            <div class="grammar-box">
              <h3 style="margin-bottom: 6px;">${g.title}</h3>
              <p style="margin: 0 0 8px;">${g.explanation}</p>
              <div class="example"><strong>補充例句：</strong>${g.example}</div>
            </div>
          `).join("")}
        </section>

        <section class="card">
          <div class="quiz-header">
            <div>
              <h2 style="margin-bottom: 4px;">雙語綜合測驗（${activeQuiz.length} 題 · 選項自動隨機排列）</h2>
              <div class="review-note">
                ${quizLang === "es" ? "目前模式：🇪🇸 西文版測驗（Cuestionario en español）" : "目前模式：🇹🇼 中文版測驗"}
              </div>
            </div>
            <div class="lang-switch">
              <button type="button" id="langEsBtn" class="${quizLang === "es" ? "secondary-active" : ""}">🇪🇸 西文版測驗</button>
              <button type="button" id="langZhBtn" class="${quizLang === "zh" ? "secondary-active" : ""}">🇹🇼 中文版測驗</button>
            </div>
          </div>

          <form id="quizForm">
            ${activeQuiz.map((qItem, qIdx) => {
              const promptText = quizLang === "es" ? qItem.esQ : qItem.zhQ;
              const opts = quizLang === "es" ? qItem.esOpts : qItem.zhOpts;
              return `
                <div class="quiz-q">
                  <div style="font-weight: 600;">${promptText}</div>
                  <div class="options">
                    ${opts.map((opt, oIdx) => `
                      <label class="option-label">
                        <input type="radio" name="q${qIdx}" value="${oIdx}" />
                        <span>${opt}</span>
                      </label>
                    `).join("")}
                  </div>
                  <div id="feedback-${qIdx}"></div>
                </div>
              `;
            }).join("")}

            <div class="quiz-actions">
              <button type="submit" class="primary">提交測驗</button>
              <button type="button" id="resetQuizBtn">🔄 重新洗牌作答／複習</button>
              <span id="scoreSummary" style="font-weight: 700;"></span>
            </div>
          </form>
        </section>
      `;

      document.querySelectorAll("[data-select-index]").forEach(btn => {
        btn.addEventListener("click", () => {
          const targetIdx = Number(btn.getAttribute("data-select-index"));
          switchLesson(targetIdx);
        });
      });

      const closeMenuBtn = document.getElementById("closeMenuBtn");
      if (closeMenuBtn) {
        closeMenuBtn.addEventListener("click", () => {
          menuOpen = false;
          render();
        });
      }

      document.getElementById("exportJsonBtn").addEventListener("click", exportLessonsJson);

      const fileInput = document.getElementById("jsonFileInput");
      document.getElementById("importJsonBtn").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          handleImportFile(e.target.files[0]);
          e.target.value = "";
        }
      });

      document.getElementById("resetDefaultBtn").addEventListener("click", resetBuiltInLessons);

      document.getElementById("playBtn").addEventListener("click", () => speakSpanish(lesson.esParagraphs));

      document.getElementById("toggleZhBtn").addEventListener("click", () => {
        showZh = !showZh;
        render();
      });

      document.getElementById("toggleEnBtn").addEventListener("click", () => {
        showEn = !showEn;
        render();
      });

      document.getElementById("langEsBtn").addEventListener("click", () => {
        quizLang = "es";
        render();
      });

      document.getElementById("langZhBtn").addEventListener("click", () => {
        quizLang = "zh";
        render();
      });

      document.getElementById("resetQuizBtn").addEventListener("click", () => {
        delete shuffledQuizCache[currentIndex];
        render();
      });

      document.getElementById("quizForm").addEventListener("submit", (e) => {
        e.preventDefault();
        let score = 0;
        const isEs = quizLang === "es";

        activeQuiz.forEach((qItem, qIdx) => {
          const opts = isEs ? qItem.esOpts : qItem.zhOpts;
          const explain = isEs ? qItem.esExplain : qItem.zhExplain;
          const selected = document.querySelector(`input[name="q${qIdx}"]:checked`);
          const fbEl = document.getElementById(`feedback-${qIdx}`);

          if (!selected) {
            fbEl.className = "feedback bad";
            fbEl.textContent = isEs
              ? `Sin responder. Respuesta correcta: "${opts[qItem.answer]}". ${explain}`
              : `尚未作答。正確答案是：「${opts[qItem.answer]}」。${explain}`;
            return;
          }

          const val = Number(selected.value);
          if (val === qItem.answer) {
            score++;
            fbEl.className = "feedback ok";
            fbEl.textContent = isEs
              ? `¡Correcto! ${explain}`
              : `✅ 答對了！${explain}`;
          } else {
            fbEl.className = "feedback bad";
            fbEl.textContent = isEs
              ? `Incorrecto. Respuesta correcta: "${opts[qItem.answer]}". ${explain}`
              : `❌ 再接再厲！正確答案是：「${opts[qItem.answer]}」。${explain}`;
          }
        });

        const summaryEl = document.getElementById("scoreSummary");
        summaryEl.textContent = isEs
          ? `Puntuación: ${score} / ${activeQuiz.length}`
          : `得分：${score} / ${activeQuiz.length}`;
      });
    }

    function switchLesson(newIndex) {
      if (newIndex >= 0 && newIndex < lessons.length) {
        currentIndex = newIndex;
        showZh = false;
        showEn = false;
        ioStatus = { type: "", message: "" };
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    toggleMenuBtn.addEventListener("click", () => {
      menuOpen = !menuOpen;
      render();
    });

    prevBtn.addEventListener("click", () => switchLesson(currentIndex - 1));
    nextBtn.addEventListener("click", () => switchLesson(currentIndex + 1));

    scrollTopBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    render();
  </script>
</body>
</html>
